name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate result files
        run: python3 scripts/validate_results.py data/results

      - name: Validate preset manifests
        run: python3 scripts/validate_presets.py data/presets

      - name: Validate evidence bundles
        run: python3 scripts/validate_evidence.py data/evidence

      - name: Build site data
        run: python3 scripts/build_site_data.py --results-dir data/results --output site/data/results.json

      - name: Build preset data
        run: python3 scripts/build_preset_data.py --output site/data/presets.json

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
